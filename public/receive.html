<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureLink - Receive</title>
<style>
  :root {
    --bg: #F7F9F8;
    --card: #FFFFFF;
    --ink: #16241E;
    --muted: #5B6B64;
    --line: #E3E9E6;
    --green: #10B981;
    --green-dark: #0B7A5F;
    --green-tint: #E6F7F1;
    --red: #E5484D;
    --red-tint: #FBEAEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .phone {
    width: 380px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(20, 40, 30, 0.12);
    padding: 28px 24px 32px;
    border: 1px solid var(--line);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.2px;
  }
  .shield {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--green-tint);
    border-radius: 8px;
    color: var(--green-dark);
  }
  .pill {
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }
  .pill.warn {
    color: #A45A00;
    background: #FDF0DD;
  }
  .pill.ok {
    color: var(--green-dark);
    background: var(--green-tint);
  }

  .banner {
    border-radius: 16px;
    padding: 18px;
    text-align: center;
    margin-bottom: 20px;
    border: 1px solid var(--line);
  }
  .banner.pending {
    background: #FBFBF9;
  }
  .banner.verified {
    background: var(--green-tint);
    border-color: #CDEEE1;
  }
  .banner.failed {
    background: var(--red-tint);
    border-color: #F5C6C6;
  }
  .banner-icon {
    font-size: 26px;
    margin-bottom: 6px;
  }
  .banner-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
  }
  .banner-sub {
    font-size: 12px;
    color: var(--muted);
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 20px 0 10px;
  }

  .field-row {
    display: flex;
    gap: 8px;
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14px;
    background: #FBFCFC;
    color: var(--ink);
    letter-spacing: 2px;
    text-align: center;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--green);
    color: white;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--green-dark); }
  button.secondary {
    background: var(--card);
    color: var(--muted);
    border: 1px dashed var(--line);
    width: 100%;
    margin-top: 14px;
    font-weight: 500;
    font-size: 12px;
  }
  button.secondary:hover { background: #F2F4F3; }

  ul#messages {
    list-style: none;
    padding: 0;
    margin: 6px 0 0;
  }
  .transfer-card {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    background: #FBFCFC;
  }
  .transfer-name {
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .transfer-name a {
    color: var(--ink);
    text-decoration: none;
  }
  .transfer-name a:hover { text-decoration: underline; }
  .transfer-status {
    font-size: 12px;
    font-weight: 600;
  }
  .transfer-status.good { color: var(--green-dark); }
  .transfer-status.bad { color: var(--red); }
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand">
        <span class="shield">&#128274;</span>
        SecureLink
      </div>
      <span class="pill ok" id="statusPill">Connecting</span>
    </div>

    <div id="warnBanner" style="background:#FDF0DD; border:1px solid #F5D9A8; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12px; color:#8A5A00;">
      ⚠ <strong>Unsafe Network Detected</strong> (simulated demo)<br>
      Device pairing and encryption are still required — this warning does not skip verification.
      <button onclick="document.getElementById('warnBanner').style.display='none'" style="margin-top:8px; background:#8A5A00; color:white; border:none; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer;">Dismiss</button>
    </div>

    <div class="banner pending" id="banner">
      <div class="banner-icon" id="bannerIcon">&#128272;</div>
      <div class="banner-title" id="bannerTitle">Waiting to pair</div>
      <div class="banner-sub" id="bannerSub">Enter the code shown on the sender's screen</div>
    </div>

    <div id="pairingForm">
      <div class="section-label">Verification Code</div>
      <div class="field-row">
        <input type="text" id="codeBox" placeholder="000000" maxlength="6">
        <button id="verifyBtn">Verify</button>
      </div>
    </div>

    <div class="section-label">Incoming Transfers</div>
    <ul id="messages"></ul>

    <button class="secondary" id="corruptBtn">&#128295; Simulate Tampered File (test)</button>
  </div>

<script>
    let corruptNext = false;
    document.getElementById('corruptBtn').addEventListener('click', () => {
      corruptNext = true;
      alert('Next incoming file will be corrupted before decryption.');
    });

    const ws = new WebSocket(`ws://${location.host}`);
    let cryptoKey = null;

    function base64ToBuf(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    async function deriveKey(code) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(code), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('SecureLinkFixedSalt'), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function sha256Hex(buf) {
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function setBanner(state, icon, title, sub) {
      const banner = document.getElementById('banner');
      banner.className = 'banner ' + state;
      document.getElementById('bannerIcon').innerHTML = icon;
      document.getElementById('bannerTitle').textContent = title;
      document.getElementById('bannerSub').textContent = sub;
    }

    ws.onopen = () => {
      document.getElementById('statusPill').textContent = 'Connected';
      setBanner('pending', '&#128272;', 'Waiting to pair', "Enter the code shown on the sender's screen");
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);

      if (data.type === 'verified') {
        if (data.success) {
          document.getElementById('pairingForm').style.display = 'none';
          setBanner('pending', '&#128272;', 'Verify Device', `Is this the device you want to connect to?`);

          const confirmBox = document.createElement('div');
          confirmBox.id = 'confirmBox';
          confirmBox.style = 'margin-top:10px; text-align:center;';
          confirmBox.innerHTML = `
            <div style="font-size:13px; color:#5B6B64; margin-bottom:10px;">
              Device ID: <strong>${data.senderId}</strong>
            </div>
            <button id="confirmDeviceBtn" style="margin-right:8px;">Confirm Device</button>
            <button id="cancelDeviceBtn" style="background:#E3E9E6; color:#16241E;">Cancel</button>
          `;
          document.getElementById('banner').insertAdjacentElement('afterend', confirmBox);

          document.getElementById('confirmDeviceBtn').addEventListener('click', async () => {
            cryptoKey = await deriveKey(document.getElementById('codeBox').value);
            setBanner('verified', '&#9989;', 'Connection Verified', 'Safe to receive files over this channel');
            confirmBox.remove();
          });

          document.getElementById('cancelDeviceBtn').addEventListener('click', () => {
            setBanner('failed', '&#10060;', 'Cancelled', 'Device connection was not confirmed');
            confirmBox.remove();
            document.getElementById('pairingForm').style.display = 'block';
          });

        } else {
          setBanner('failed', '&#10060;', 'Wrong Code', 'Try again with the code shown on the sender');
        }
      }

      if (data.type === 'chat') {
        const li = document.createElement('li');
        li.className = 'transfer-card';
        li.textContent = data.text;
        document.getElementById('messages').appendChild(li);
      }

      if (data.type === 'file') {
        const li = document.createElement('li');
        li.className = 'transfer-card';

        if (!cryptoKey) {
          li.textContent = `Received ${data.filename} but no encryption key available.`;
          document.getElementById('messages').appendChild(li);
          return;
        }

        try {
          if (corruptNext) {
            corruptNext = false;
            data.data = data.data.slice(0, -4) + (data.data.slice(-4) === 'AAAA' ? 'BBBB' : 'AAAA');
          }

          const encryptedBuf = base64ToBuf(data.data);
          const iv = new Uint8Array(base64ToBuf(data.iv));

          const decryptedBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, cryptoKey, encryptedBuf);

          const actualHash = await sha256Hex(decryptedBuf);
          const integrityOk = actualHash === data.hash;

          const blob = new Blob([decryptedBuf]);
          const url = URL.createObjectURL(blob);

          const nameDiv = document.createElement('div');
          nameDiv.className = 'transfer-name';
          const link = document.createElement('a');
          link.href = url;
          link.download = data.filename;
          link.textContent = data.filename;
          nameDiv.appendChild(link);
          li.appendChild(nameDiv);

          const statusDiv = document.createElement('div');
          statusDiv.className = 'transfer-status ' + (integrityOk ? 'good' : 'bad');
          statusDiv.textContent = integrityOk
            ? '🔒 Decrypted · Integrity Verified'
            : '⚠ WARNING: Integrity check failed';
          li.appendChild(statusDiv);

        } catch (err) {
          const nameDiv = document.createElement('div');
          nameDiv.className = 'transfer-name';
          nameDiv.textContent = data.filename;
          li.appendChild(nameDiv);

          const statusDiv = document.createElement('div');
          statusDiv.className = 'transfer-status bad';
          statusDiv.textContent = '⚠ Failed to decrypt: wrong key or corrupted data';
          li.appendChild(statusDiv);
        }

        document.getElementById('messages').appendChild(li);
      }
    };

    document.getElementById('verifyBtn').addEventListener('click', () => {
      const code = document.getElementById('codeBox').value;
      ws.send(JSON.stringify({ type: 'verify-code', code }));
    });
</script>
</body>
</html>
