<!DOCTYPE html>
<html>
<head><title>SecureLink - INSECURE DEMO (Send)</title></head>
<body>
  <h1 style="color:red;">⚠ Insecure Demo Sender (no encryption)</h1>
  <p id="status">Connecting...</p>
  <p>Pairing code: <strong id="code">...</strong></p>
  <input type="file" id="fileInput">
  <button id="sendFileBtn">Send File (Plaintext)</button>
  <p id="fileStatus"></p>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      document.getElementById('status').textContent = 'Connected!';
      ws.send(JSON.stringify({ type: 'start-pairing' }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'pairing-code') {
        document.getElementById('code').textContent = data.code;
      }
    };

    document.getElementById('sendFileBtn').addEventListener('click', () => {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const base64Data = reader.result.split(',')[1];
        ws.send(JSON.stringify({
          type: 'file',
          filename: file.name,
          data: base64Data,
          iv: '',
          hash: ''
        }));
        document.getElementById('fileStatus').textContent = `Sent (plaintext): ${file.name}`;
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
