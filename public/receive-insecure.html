<!DOCTYPE html>
<html>
<head><title>SecureLink - INSECURE DEMO (Receive)</title></head>
<body>
  <h1 style="color:red;">⚠ Insecure Demo Receiver (no encryption)</h1>
  <p id="status">Connecting...</p>
  <div id="pairingForm">
    <input type="text" id="codeBox" placeholder="Enter pairing code">
    <button id="verifyBtn">Verify</button>
  </div>
  <ul id="messages"></ul>

  <script>
    const ws = new WebSocket(`ws://${location.host}`);

    ws.onopen = () => {
      document.getElementById('status').textContent = 'Connected! Enter the pairing code.';
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'verified') {
        document.getElementById('status').textContent = data.success ? 'Verified!' : 'Wrong code';
        if (data.success) document.getElementById('pairingForm').style.display = 'none';
      }
      if (data.type === 'file') {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = `data:application/octet-stream;base64,${data.data}`;
        link.download = data.filename;
        link.textContent = `Download: ${data.filename}`;
        li.appendChild(link);
        document.getElementById('messages').appendChild(li);
      }
    };

    document.getElementById('verifyBtn').addEventListener('click', () => {
      const code = document.getElementById('codeBox').value;
      ws.send(JSON.stringify({ type: 'verify-code', code }));
    });
  </script>
</body>
</html>
