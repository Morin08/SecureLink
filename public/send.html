<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SecureLink - Send</title>
<style>
  :root {
    --bg: #F7F9F8;
    --card: #FFFFFF;
    --ink: #16241E;
    --muted: #5B6B64;
    --line: #E3E9E6;
    --green: #10B981;
    --green-dark: #0B7A5F;
    --green-tint: #E6F7F1;
    --red: #E5484D;
    --red-tint: #FBEAEA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .phone {
    width: 380px;
    background: var(--card);
    border-radius: 28px;
    box-shadow: 0 20px 50px rgba(20, 40, 30, 0.12);
    padding: 28px 24px 32px;
    border: 1px solid var(--line);
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: -0.2px;
  }
  .shield {
    width: 26px; height: 26px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--green-tint);
    border-radius: 8px;
    color: var(--green-dark);
  }
  .pill {
    font-size: 11px;
    font-weight: 600;
    color: var(--green-dark);
    background: var(--green-tint);
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.2px;
  }
  .status-line {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .status-line.connected { color: var(--green-dark); font-weight: 600; }

  .code-card {
    background: var(--green-tint);
    border: 1px solid #CDEEE1;
    border-radius: 16px;
    padding: 22px;
    text-align: center;
    margin-bottom: 22px;
  }
  .code-label {
    font-size: 12px;
    color: var(--green-dark);
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .code-digits {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 6px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .code-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
  }

  .section-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 22px 0 10px;
  }

  .field-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  input[type="text"], input[type="file"] {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 14px;
    background: #FBFCFC;
    color: var(--ink);
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    background: var(--green);
    color: white;
    transition: background 0.15s ease;
  }
  button:hover { background: var(--green-dark); }
  button.secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
  }
  button.secondary:hover { background: #F2F4F3; }

  .filebar {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
  }
  .note.ok { color: var(--green-dark); font-weight: 600; }

  ul#log {
    list-style: none;
    padding: 0;
    margin: 10px 0 0;
  }
  ul#log li {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="topbar">
      <div class="brand">
        <span class="shield">&#128274;</span>
        SecureLink
      </div>
      <span class="pill">AES-GCM-256</span>
    </div>

    <div id="warnBanner" style="background:#FDF0DD; border:1px solid #F5D9A8; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:12px; color:#8A5A00;">
      ⚠ <strong>Unsafe Network Detected</strong> (simulated demo)<br>
      Device pairing and encryption are still required — this warning does not skip verification.
      <button onclick="document.getElementById('warnBanner').style.display='none'" style="margin-top:8px; background:#8A5A00; color:white; border:none; border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer;">Dismiss</button>
    </div>

    <div class="status-line" id="status">Connecting…</div>

    <div class="code-card">
      <div class="code-label">Pairing Code</div>
      <div class="code-digits" id="code">------</div>
      <div class="code-sub">Share this code with the receiving device</div>
    </div>

    <div class="section-label">Send a Message</div>
    <div class="field-row">
      <input type="text" id="msgBox" placeholder="Type a message">
      <button id="sendBtn">Send</button>
    </div>

    <div class="section-label">Send a File</div>
    <div class="filebar">
      <input type="file" id="fileInput">
    </div>
    <button id="sendFileBtn" style="width:100%;">Send File (Encrypted)</button>
    <div class="note" id="fileStatus"></div>

    <ul id="log"></ul>
  </div>

<script>
    const ws = new WebSocket(`ws://${location.host}`);
    let pairingCode = null;
    let cryptoKey = null;

    function bufToBase64(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)));
    }

    async function deriveKey(code) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw', enc.encode(code), { name: 'PBKDF2' }, false, ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: enc.encode('SecureLinkFixedSalt'), iterations: 100000, hash: 'SHA-256' },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['encrypt', 'decrypt']
      );
    }

    async function sha256Hex(buf) {
      const hashBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    ws.onopen = () => {
      document.getElementById('status').textContent = 'Connected';
      document.getElementById('status').classList.add('connected');
      ws.send(JSON.stringify({ type: 'start-pairing' }));
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);
      if (data.type === 'pairing-code') {
        pairingCode = data.code;
        document.getElementById('code').textContent = data.code;
        cryptoKey = await deriveKey(pairingCode);
      }
      if (data.type === 'chat') {
        const li = document.createElement('li');
        li.textContent = 'Received: ' + data.text;
        document.getElementById('log').appendChild(li);
      }
    };

    document.getElementById('sendBtn').addEventListener('click', () => {
      const msg = document.getElementById('msgBox').value;
      if (!msg) return;
      ws.send(JSON.stringify({ type: 'chat', text: msg }));
      const li = document.createElement('li');
      li.textContent = 'Sent: ' + msg;
      document.getElementById('log').appendChild(li);
      document.getElementById('msgBox').value = '';
    });

    document.getElementById('sendFileBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const statusEl = document.getElementById('fileStatus');
      if (!file) {
        statusEl.textContent = 'Pick a file first.';
        statusEl.classList.remove('ok');
        return;
      }
      if (!cryptoKey) {
        statusEl.textContent = 'Still setting up encryption, try again in a second.';
        statusEl.classList.remove('ok');
        return;
      }

      const fileBuf = await file.arrayBuffer();
      const hash = await sha256Hex(fileBuf);

      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encryptedBuf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, cryptoKey, fileBuf);

      ws.send(JSON.stringify({
        type: 'file',
        filename: file.name,
        data: bufToBase64(encryptedBuf),
        iv: bufToBase64(iv),
        hash: hash
      }));

      statusEl.textContent = `Sent (encrypted): ${file.name}`;
      statusEl.classList.add('ok');
    });
</script>
</body>
</html>
